name: Publish verified release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml', 'src/**', 'scripts/**', 'tests/**', 'global.json', 'plugins/**', 'README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build from source and run security checks
        shell: pwsh
        run: ./scripts/verify-release.ps1
      - name: Create distribution archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/sync-payload.ps1
      - name: Package verified build
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Attest distribution provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip
          create-storage-record: false
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: ./scripts/publish-release.ps1
